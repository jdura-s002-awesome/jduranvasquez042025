<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

<style>
    body{
        background-color: #fff9da;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }
    h1
    {
        text-align: center;
        color: #b18484;
    }
    .gallery
    {
        background-color: #ffd6f9;
        border: 8px dotted #ffcef7;
        width: 90%;
        max-width: 1280px;
        margin: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 20px;
    }
    figure
    {
        background-color: #fff9da;
        width: 100%;
        max-width: 250px;
        padding: 1rem;
        margin: 1rem;
        border: 6px dotted #d27c7c7d;
        border-radius: 20px;
}
figcaption
{
    text-align: center;
    color: #a57474;
    padding: .5rem; 
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}
img
{
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 2%;

}
</style>

</head>
<body>
    <h1>Flex Photo Gallery</h1>

<div class="gallery">
    <figure>  
        <img src="https://picsum.photos/300/300/?random=1" alt="Random Picsum Image">
        <figcaption>Description</figcaption>
        </figure>

    <figure>    
        <img src="https://picsum.photos/300/300/?random=2" alt="Random Picsum Image">
        <figcaption>Description</figcaption>
    </figure>

    </figure>
    <figure>

        <figcaption>Description</figcaption>
    </figure>
    <figure>

</div>

</html>
