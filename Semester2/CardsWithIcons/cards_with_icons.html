<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards With Icons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body{
            background-color: #feffe4;
            color: #ffc3ee;
            font-family: Georgia, 'Times New Roman', Times, serif;
            line-height: 1.5;
        }

        h1,h2{
            text-align: center;
        }

        .fbcards{
            background-color: #c8e7ff;
            border: 2px dashed lightyellow;
            padding: 1rem;
            max-width: 1200px;
            margin: auto;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cardcircle{
            background-color: #e0f1ff;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin: auto;
            border: 4px dotted lightyellow;
        }
    
        .card{
            background-color: #ffe4f7;
            border: 2px solid lightgoldenrodyellow;
            padding: 1rem;
            text-align: center;
            border-radius: 8px;
        }

        @media screen and (min-width: 700px){
            .fbcards{
                flex-direction: row;
            }
        }
        
    </style>
</head>

<body>
    <h1>Cards With Icons</h1>
    <h2>Font Awesome</h2>

    <section class="fbcards">
        <article class="card">
            <div class="cardcircle">
                <i class="fa-solid fa-shield-dog"></i>
            </div>
            <h3>Card Header</h3>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Tenetur, quod.</p>
        </article>
        <article class="card">
            <div class="cardcircle">
                <i class="fa-solid fa-shield-dog"></i>
            </div>
            <h3>Card Header</h3>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Tenetur, quod.</p>
        </article>
        <article class="card">
            <div class="cardcircle">
                <i class="fa-solid fa-shield-dog"></i>
            </div>
            <h3>Card Header</h3>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Tenetur, quod.</p>
        </article>
    </section>
</body>

</html>
